name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # Фиксированный runner избегает зависаний в очереди ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Select Android NDK
        shell: bash
        run: |
          NDK_HOME="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$NDK_HOME")" >> "$GITHUB_ENV"

      - name: Install TDLib build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli ninja-build

      - name: Build TDLib JSON for Android
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tdlib/td.git third_party/td
          cd third_party/td/example/android
          ./build-openssl.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl c++_shared JSON 21 "arm64-v8a armeabi-v7a x86_64"
          echo "TDLIB_ANDROID_LIB_ROOT=$PWD/tdlib/libs" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp "third_party/td/example/android/tdlib/libs/$ABI/"*.so "app/src/main/jniLibs/$ABI/"
          done

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust native libraries
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Set up Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1.1'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-rust-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
